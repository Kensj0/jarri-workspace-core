[package]
name = "jarri-workspace-core"
version = "0.3.0"
description = "Jarri Workspace Core desktop shell"
authors = ["Matz"]
license = "MIT"
repository = "https://github.com/TorMatzAndren/jarri-workspace-core"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri = { version = "2.10.3", features = ["image-png"] }
tauri-plugin-clipboard-manager = "2"
